[package]
name = "cosmos-event-bridge"
version = "0.1.0"
edition = "2021"
description = "COSMOS event bridge — consumes OpenWhisk invocation events, writes BPF metadata"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
cosmos-metadata-model = { path = "../cosmos-metadata-model" }
